name: 开发任务
description: 按团队开发指南领取一个可验收任务
body:
  - type: input
    id: task
    attributes:
      label: 任务 ID / 角色 / 优先级 / 本次汇报目标
      placeholder: A-01 / A / P0 / 完成 PR 快照获取与离线测试
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 目标、范围与交付物
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: 依赖、输入输出与协作对象
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准与自动化测试
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: 风险、阻塞与不做事项
